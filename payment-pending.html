<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Заказ Dr. DarSun ожидает подтверждения.">
    <title>Платёж в обработке | Dr. DarSun</title>
    <link rel="stylesheet" href="css/base.css?v=chat-ui-fix-1">

<body>

            <p class="payment-result__order" data-order-number hidden></p>
            <div class="payment-result__actions">
                <a class="btn btn--primary" href="index.html">На главную</a>
                <a class="btn payment-result__secondary" href="profile.html">Проверить заказ в профиле</a>
