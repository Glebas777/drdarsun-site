<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. DarSun | Сброс пароля</title>
    <link rel="stylesheet" href="css/base.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #0A0A0A; margin: 0;">
    <div style="background: #151515; border: 1px solid #2A2A2A; padding: 40px; border-radius: 24px; max-width: 400px; width: 90%; text-align: center;">
        <h2 style="color: #fff; margin-bottom: 20px;">Новый пароль</h2>
        <p style="color: #aaa; margin-bottom: 20px; font-size: 14px;">Введите новый пароль для входа.</p>
        
        <form id="reset-form" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="password" id="reset-password" placeholder="Минимум 6 символов" required style="padding: 12px; border-radius: 8px; border: 1px solid #2A2A2A; background: #0A0A0A; color: #fff; outline: none;">
            <button type="submit" id="reset-btn" style="padding: 12px; border-radius: 8px; background: #D4AF37; color: #000; border: none; font-weight: bold; cursor: pointer;">Сменить пароль</button>
        </form>
        <div id="reset-message" style="margin-top: 20px; color: #F44336;"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://drdarsun-site-main.layero.app';
        const SUPABASE_ANON_KEY = 'ТВОЙ_ANON_KEY_ИЗ_ENV'; // Вставь ключ!
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initReset() {
            const params = new URLSearchParams(window.location.search);
            const token_hash = params.get('token_hash');

            if (!token_hash) {
                document.getElementById('reset-message').textContent = 'Ошибка: токен не найден.';
                return;
            }

            const { error } = await supabaseClient.auth.verifyOtp({
                token_hash: token_hash,
                type: 'recovery'
            });

            if (error) {
                document.getElementById('reset-message').textContent = 'Ошибка: ' + error.message;
            }
        }

        initReset();

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('reset-password').value;
            const btn = document.getElementById('reset-btn');
            const msg = document.getElementById('reset-message');

            if (newPassword.length < 6) {
                msg.textContent = 'Пароль слишком короткий.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Меняем...';

            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

            if (error) {
                msg.textContent = 'Ошибка: ' + error.message;
                btn.disabled = false;
                btn.textContent = 'Сменить пароль';
            } else {
                msg.style.color = '#4CAF50';
                msg.textContent = 'Пароль успешно изменен! Перенаправление...';
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        });
    </script>
</body>
</html>
