<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. DarSun | Сброс пароля</title>
    <link rel="stylesheet" href="css/base.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-color); margin: 0;">
    <div style="background: var(--bg-card); border: 1px solid var(--border); padding: 40px; border-radius: 24px; max-width: 400px; width: 90%; text-align: center;">
        <h2 style="color: var(--text-main); margin-bottom: 20px;">Новый пароль</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">Введите новый пароль для входа.</p>
        
        <form id="reset-form" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="password" id="reset-password" placeholder="Минимум 8 символов" minlength="8" autocomplete="new-password" required style="padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); outline: none;">
            <button type="submit" id="reset-btn" style="padding: 12px; border-radius: 8px; background: #D4AF37; color: #000; border: none; font-weight: bold; cursor: pointer;">Сменить пароль</button>
        </form>
        <div id="reset-message" role="status" aria-live="polite" style="margin-top: 20px; color: #F44336;"></div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase-client.js';

        const form = document.getElementById('reset-form');
        const button = document.getElementById('reset-btn');
        const message = document.getElementById('reset-message');
        let recoveryReady = false;

        try {
            const params = new URLSearchParams(window.location.search);
            const tokenHash = params.get('token_hash');
            const code = params.get('code');
            let error;
            if (tokenHash) {
                ({ error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' }));
            } else if (code) {
                ({ error } = await supabase.auth.exchangeCodeForSession(code));
            } else {
                throw new Error('Ссылка восстановления неполная или устарела. Запросите новую.');
            }
            if (error) throw error;
            recoveryReady = true;
            message.textContent = 'Введите новый пароль.';
            message.style.color = '#4CAF50';
        } catch (error) {
            message.textContent = `Не удалось подтвердить ссылку: ${error.message}`;
            form.hidden = true;
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            if (!recoveryReady) return;
            const password = document.getElementById('reset-password').value;
            if (password.length < 8) {
                message.textContent = 'Пароль должен содержать не менее 8 символов.';
                return;
            }
            button.disabled = true;
            button.textContent = 'Меняем…';
            try {
                const { error } = await supabase.auth.updateUser({ password });
                if (error) throw error;
                message.style.color = '#4CAF50';
                message.textContent = 'Пароль изменён. Перенаправляем на вход…';
                setTimeout(() => window.location.href = 'login.html', 2000);
            } catch (error) {
                message.textContent = `Ошибка: ${error.message}`;
                button.disabled = false;
                button.textContent = 'Сменить пароль';
            }
        });
    </script>
    <script src="js/site-status.js"></script>
</body>
</html>
