<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0A0F0A">
    <title>Технический перерыв · Dr. DarSun</title>
    <link rel="stylesheet" href="css/base.css?v=chat-ui-fix-1">
    <style>
        body { display: grid; min-height: 100vh; place-items: center; padding: 24px; background: linear-gradient(rgba(7, 17, 9, .78), rgba(7, 17, 9, .86)), url('assets/images/load_night.png') center / cover fixed; color: #FAF7E6; }
        main { width: min(100%, 620px); padding: clamp(28px, 7vw, 56px); border: 1px solid rgba(212, 175, 55, .4); border-radius: 28px; background: rgba(11, 42, 15, .84); text-align: center; box-shadow: 0 24px 80px rgba(0, 0, 0, .35); backdrop-filter: blur(12px); }
        main img { width: 92px; height: 92px; object-fit: contain; }
        h1 { margin: 22px 0 12px; font-size: clamp(30px, 7vw, 48px); }
        p { color: rgba(250, 247, 230, .78); line-height: 1.7; }
        .maintenance-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; margin-top: 24px; }
        .maintenance-actions a, .maintenance-actions button { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 11px 20px; border: 1px solid rgba(212, 175, 55, .6); border-radius: 999px; background: transparent; color: #F9C74F; font: inherit; font-weight: 650; cursor: pointer; }
        .maintenance-actions button { background: #D4AF37; color: #102411; }
        .maintenance-actions button:disabled { cursor: wait; opacity: .65; }
        #maintenance-status { min-height: 1.5em; margin: 12px 0 0; font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <img src="assets/images/load_drop_hello.png" alt="">
        <p class="eyebrow">DR. DARSUN</p>
        <h1 id="maintenance-heading">Плановые технические работы</h1>
        <p id="maintenance-message">Мы обновляем сайт. Скоро вернёмся — ваши данные и аккаунт в безопасности.</p>
        <p>Пожалуйста, зайдите чуть позже.</p>
        <div class="maintenance-actions">
            <button type="button" id="maintenance-retry">Попробовать ещё раз</button>
            <a href="mailto:drdarsunhelper@gmail.com">Написать на почту</a>
        </div>
        <p id="maintenance-status" role="status" aria-live="polite"></p>
    </main>
    <script>
        const retryButton = document.getElementById('maintenance-retry');
        const statusMessage = document.getElementById('maintenance-status');
        let checkingStatus = false;
        const maintenanceModes = {
            planned: {
                heading: 'Плановые технические работы',
                message: 'Мы обновляем сайт. Скоро вернёмся — ваши данные и аккаунт в безопасности.'
            },
            emergency: {
                heading: 'Срочный технический перерыв',
                message: 'Мы временно закрыли сайт и уже разбираемся с проблемой. Данные и аккаунты не затронуты.'
            }
        };

        function renderMaintenanceMode(mode) {
            const copy = maintenanceModes[mode] || maintenanceModes.planned;
            document.getElementById('maintenance-heading').textContent = copy.heading;
            document.getElementById('maintenance-message').textContent = copy.message;
        }

        async function checkSiteStatus() {
            if (checkingStatus || document.hidden) return;
            checkingStatus = true;
            retryButton.disabled = true;
            retryButton.textContent = 'Проверяем…';
            try {
                const response = await fetch('https://drdarsun-site-main.layero.app/api/site-status', {
                    cache: 'no-store',
                    signal: AbortSignal.timeout(10_000)
                });
                const result = await response.json().catch(() => null);
                if (!response.ok) throw new Error('Сервис пока не отвечает. Попробуйте чуть позже.');
                renderMaintenanceMode(result?.mode);
                if (result?.maintenance === false) {
                    statusMessage.textContent = 'Сайт снова доступен. Переходим…';
                    window.location.replace('index.html');
                    return;
                }
                statusMessage.textContent = 'Технический перерыв ещё продолжается. Мы проверим снова автоматически.';
            } catch (error) {
                statusMessage.textContent = error instanceof TypeError || error.name === 'TimeoutError'
                    ? 'Не получилось связаться с сервером. Проверьте интернет и нажмите ещё раз.'
                    : error.message || 'Не удалось проверить статус. Попробуйте ещё раз.';
                console.warn('Maintenance status check failed:', error);
            } finally {
                checkingStatus = false;
                retryButton.disabled = false;
                retryButton.textContent = 'Попробовать ещё раз';
            }
        }

        retryButton.addEventListener('click', checkSiteStatus);
        checkSiteStatus();
        window.setInterval(checkSiteStatus, 5000);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) checkSiteStatus();
        });
    </script>
    <script src="js/music-player.js"></script>
    <script src="js/floating-controls.js"></script>
    <script type="module" src="js/site-toasts.js?v=service-timeouts-2"></script>
    <script type="module" src="js/temporary-payment-notice.js?v=service-timeouts-2"></script>
</body>
</html>
