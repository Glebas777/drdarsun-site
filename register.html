<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="turnstile-site-key" content="0x4AAAAAAGFkyMNZ_z9wAXb8">
    <title>Dr. DarSun | Регистрация</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/auth-mobile.css">
    
    <style>
        .auth-container { max-width: 420px; margin: 0 auto; padding: 20px; }
        .input-with-btn { position: relative; display: flex; align-items: center; }
        .input-with-btn input { padding-right: 50px; }
        .send-code-btn { position: absolute; right: 10px; background: transparent; border: none; color: #D4AF37; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .send-code-btn:hover { transform: scale(1.1); }
        #verify-block { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #2A2A2A; }
        .verify-title { color: #D4AF37; font-size: 14px; margin-bottom: 10px; text-align: center; }
        .verify-code-input { width: 100%; padding: 15px; background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 12px; color: #fff; text-align: center; font-size: 24px; letter-spacing: 10px; outline: none; margin-bottom: 15px; }
    </style>
</head>
<body class="auth-page">

    <div class="video-background">
        <video class="bg-video active" src="assets/videos/кадр1.mp4" muted playsinline autoplay></video>
        <video class="bg-video" src="assets/videos/кадр2.mp4" muted playsinline></video>
        <video class="bg-video" src="assets/videos/кадр3.mp4" muted playsinline></video>
        <video class="bg-video" src="assets/videos/кадр4.mp4" muted playsinline></video>
        <video class="bg-video" src="assets/videos/кадр5.mp4" muted playsinline></video>
        <video class="bg-video" src="assets/videos/кадр6.mp4" muted playsinline></video>
    </div>
    <div class="video-overlay"></div>

    <a href="index.html" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        На главную
    </a>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <img src="assets/images/logo.png" alt="Dr. DarSun" class="auth-logo-img">
                <h2>Создать аккаунт</h2>
                <p>Присоединяйтесь к клубу гурманов</p>
            </div>

            <form id="register-form" class="auth-form">
                <div class="input-group">
                    <label>Имя</label>
                    <input type="text" id="reg-name" placeholder="Ваше имя" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <div class="input-with-btn">
                        <input type="email" id="reg-email" placeholder="your@email.com" required>
                        <button type="button" id="send-code-btn" class="send-code-btn" title="Отправить код">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                <div id="captcha-register" class="auth-captcha" data-turnstile data-action="sign_up" hidden></div>

                <!-- Блок подтверждения -->
                <div id="verify-block">
                    <p class="verify-title">Введите 4-значный код из письма</p>
                    <input type="text" id="verify-code" class="verify-code-input" placeholder="0000" maxlength="4">
                    <button type="button" id="verify-btn" class="btn btn--primary btn--full" style="background: #4CAF50; color: #fff; border: none;">Подтвердить почту</button>
                </div>

                <div class="login-actions">
                    <button type="submit" class="btn btn--primary btn--full" id="submit-register" style="display: none;">Зарегистрироваться</button>
                </div>
            </form>

            <div class="auth-divider">
                <span>или войти через</span>
            </div>

            <div class="auth-socials">
                <button class="social-btn yandex" id="btn-yandex">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3H10c-2.8 0-4.5 1.5-4.5 4 0 1.6.7 2.6 2.1 3.6L4.3 16h2.5l3.2-5.2h1V16h2.2V3H12.5zM11 9.6h-1.3c-1.4 0-2.1-.7-2.1-2.2 0-1.4.7-2.2 2.1-2.2H11v4.4z"/></svg>
                    Яндекс
                </button>
                <button class="social-btn google" id="btn-google">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
                    Google
                </button>
            </div>
            
            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videos = document.querySelectorAll('.bg-video');
            if (videos.length <= 1) return;
            let currentIndex = 0;
            videos[0].play().catch(() => {});
            setInterval(() => {
                videos[currentIndex].classList.remove('active');
                videos[currentIndex].pause();
                currentIndex = (currentIndex + 1) % videos.length;
                videos[currentIndex].classList.add('active');
                videos[currentIndex].play().catch(() => {});
            }, 10000);
        });
    </script>
    <script type="module" src="js/auth.js"></script>
    <script src="js/burger.js"></script>
    <script src="js/site-status.js"></script>
</body>
</html>
