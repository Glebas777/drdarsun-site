<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dr. DarSun | Товар</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <style>
        .product-page { padding: 40px 0; }
        .product-layout { display: flex; gap: 50px; margin-bottom: 60px; }
        .product-gallery { flex: 1; }
        .main-image { width: 100%; height: 500px; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 40px; margin-bottom: 20px; }
        .main-image img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .thumbnails { display: flex; gap: 10px; }
        .thumb { width: 80px; height: 80px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .thumb img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .thumb.active { border-color: var(--accent-green); }
        .product-info { flex: 1; }
        .product-info h1 { font-size: 36px; margin-bottom: 15px; }
        .product-price { font-size: 32px; font-weight: 700; color: var(--accent-green); margin-bottom: 30px; }
        .product-desc { font-size: 16px; color: var(--text-muted); line-height: 1.6; margin-bottom: 30px; }
        .product-actions { display: flex; gap: 15px; margin-bottom: 40px; }
        .product-actions .btn { flex: 1; padding: 16px; font-size: 16px; }
        .specs { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 40px; }
        .spec-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
        .spec-row:last-child { border-bottom: none; }
        .spec-row span:first-child { color: var(--text-muted); }
        @media (max-width: 768px) {
            .product-layout { flex-direction: column; gap: 30px; }
            .main-image { height: 300px; }
            .product-info h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo"><img src="assets/images/banner.png" alt="Dr. DarSun"></a>
            <nav class="nav">
                <a href="catalog.html">Каталог</a>
                <a href="about.html">О нас</a>
                <a href="delivery.html">Доставка</a>
            </nav>
            <div class="header__actions">
                <button class="theme-toggle" id="theme-toggle"></button>
                <a href="cart.html" class="icon-btn">🛒</a>
                <a href="login.html" class="btn btn--primary">Войти</a>
            </div>
        </div>
    </header>

    <main class="product-page container">
        <div class="product-layout">
            <div class="product-gallery">
                <div class="main-image"><img src="assets/images/sunflower.png" id="main-img" alt="Товар"></div>
                <div class="thumbnails"></div>
            </div>
            <div class="product-info">
                <h1 id="product-name">Загрузка...</h1>
                <div class="product-price" id="product-price">...</div>
                <p class="product-desc" id="product-desc"></p>
                <div class="product-actions">
                    <button class="btn btn--primary" id="add-to-cart-btn">В корзину</button>
                    <button class="btn" style="border: 1px solid var(--border); flex: 0 0 60px;">❤️</button>
                </div>
                <div class="specs">
                    <div class="spec-row"><span>Объем</span><span id="spec-volume">...</span></div>
                    <div class="spec-row"><span>Тип отжима</span><span>Холодный</span></div>
                    <div class="spec-row"><span>Срок годности</span><span>6 месяцев</span></div>
                    <div class="spec-row"><span>Упаковка</span><span>Темное стекло</span></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <div class="footer__col">
                <div class="footer__logo-group">
                    <img src="assets/images/logo_full.png" alt="Dr. DarSun">
                    <img src="assets/images/logo.png" alt="Dr. DarSun">
                </div>
                <p class="footer__desc">Премиальные растительные масла. Сделано с душой.</p>
            </div>
            <div class="footer__col">
                <h4>Покупателям</h4>
                <a href="catalog.html">Каталог</a>
                <a href="delivery.html">Доставка</a>
                <a href="about.html">О нас</a>
            </div>
            <div class="footer__col">
                <h4>Контакты</h4>
                <a href="mailto:info@drdarsun.ru">info@drdarsun.ru</a>
<div class="socials">
    <a href="#" class="social-link"><img src="assets/images/vk.png" alt="VK"></a>
    <a href="#" class="social-link"><img src="assets/images/telegram.png" alt="TG"></a>
</div>
            </div>
        </div>
        <div class="footer__bottom">
            <div class="container">© 2026 Dr. DarSun. Все права защищены.</div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script type="module" src="js/product.js"></script>
</body>
</html>
