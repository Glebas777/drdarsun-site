name = "drdarsun-telegram-client"
main = "src/index.mjs"
compatibility_date = "2026-11-18"

[vars]
WORKER_ROLE = "client"
LAYER0_API_BASE_URL = "https://drdarsun-site-main.layero.app"
TELEGRAM_WORKER_PUBLIC_URL = "https://drdarsun-telegram-client.turgleb7.workers.dev"

[triggers]
crons = ["*/5 * * * *"]

[[queues.producers]]
queue = "drdarsun-telegram-client"
binding = "UPDATES"

[[queues.consumers]]
queue = "drdarsun-telegram-client"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 100
max_concurrency = 1
dead_letter_queue = "drdarsun-telegram-client-dlq"
