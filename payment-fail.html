<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Не удалось завершить оплату заказа Dr. DarSun.">
    <title>Оплата не прошла | Dr. DarSun</title>
    <link rel="stylesheet" href="css/base.css?v=chat-ui-fix-1">
    <link rel="stylesheet" href="css/payment-result.css?v=payment-pages-1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="payment-result payment-result--fail">
        <div class="payment-result__card">
            <div class="payment-result__icon" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="m21 21 22 22m0-22L21 43"/></svg></div>
            <p class="eyebrow">DR. DARSUN · ОПЛАТА</p>
            <h1>Оплата не прошла</h1>
            <p class="payment-result__lead">Платёж не подтверждён. Проверьте способ оплаты и попробуйте ещё раз. Если сумма списалась, не повторяйте оплату — напишите поддержке.</p>
            <p class="payment-result__order" data-order-number hidden></p>
            <div class="payment-result__actions">
                <a class="btn btn--primary" href="cart.html">Вернуться в корзину</a>
                <a class="btn payment-result__secondary" href="https://t.me/drdarsun" target="_blank" rel="noopener noreferrer">Связаться с поддержкой</a>
            </div>
        </div>
    </main>
    <script type="module" src="js/payment-result.js?v=payment-pages-1"></script>
