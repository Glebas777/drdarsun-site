<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. DarSun | Корзина</title>
    <link rel="stylesheet" href="css/base.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="preloader">
    <div class="bg-image" id="bg-load_morning" style="background-image: url('assets/images/load_morning.png');"></div>
    <div class="bg-image" id="bg-load_day" style="background-image: url('assets/images/load_day.png');"></div>
    <div class="bg-image" id="bg-load_evening" style="background-image: url('assets/images/load_evening.png');"></div>
    <div class="bg-image" id="bg-load_night" style="background-image: url('assets/images/load_night.png');"></div>

    <img src="assets/images/load_doctor.png" class="preloader-side left" alt="">

    <div class="preloader-content">
        <img src="assets/images/load_ring.png" class="preloader-ring" alt="">
        <img src="assets/images/load_sample.png" class="preloader-sample" alt="">
    </div>

    <div class="preloader-progress">
        <div class="preloader-progress-bar"></div>
    </div>
</div>
<header class="header">
    <div class="container header__inner">
        <a href="index.html" class="logo"><img src="assets/images/banner.png" alt="Dr. DarSun"></a>
        <nav class="nav">
            <a href="catalog.html">Каталог</a>
            <a href="about.html">О нас</a>
            <a href="delivery.html">Доставка</a>
        </nav>
<div class="header__actions">
    <button class="theme-toggle" id="theme-toggle"></button>
    <a href="cart.html" class="icon-btn">🛒</a>
    <div id="auth-buttons"></div> 
    <button class="burger" id="burger-btn"><span></span><span></span><span></span></button>
</div>
    </div>
    <!-- Мобильное меню -->
    <div class="mobile-menu" id="mobile-menu">
        <a href="catalog.html">Каталог</a>
        <a href="about.html">О нас</a>
        <a href="delivery.html">Доставка</a>
    </div>
</header>

    <main class="container" style="padding: 40px 0;">
        <h1 style="margin-bottom: 20px;">Корзина</h1>
        <div class="cart-layout" style="display: flex; gap: 30px;">
            <div class="cart-items" id="cart-items" style="flex: 1;"></div>
            <div class="cart-summary" style="width: 350px; background: var(--bg-card); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); height: fit-content;">
                <h3>Итого</h3>
                <div class="summary-row" style="display: flex; justify-content: space-between; margin: 10px 0;"><span>Товары</span><span id="sum-subtotal">0 ₽</span></div>
                <div class="summary-row total" style="display: flex; justify-content: space-between; margin: 10px 0; font-weight: bold; font-size: 20px;"><span>К оплате</span><span id="sum-total">0 ₽</span></div>
                
                <button class="btn btn--primary" style="width:100%; margin-top:20px;" id="checkout-btn">Оформить</button>
                
                <form id="checkout-form" style="display:none; flex-direction:column; gap:10px; margin-top:20px;">
                    <input type="text" id="order-name" placeholder="Имя" required style="padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-color); color:var(--text-main);">
                    <input type="tel" id="order-phone" placeholder="Телефон" required style="padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-color); color:var(--text-main);">
                    <input type="text" id="order-address" placeholder="Адрес" required style="padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-color); color:var(--text-main);">
                    
                    <p style="font-size:14px; font-weight:600;">Оплата:</p>
                    <label><input type="radio" name="payment" value="card" checked> Карта</label>
                    <label><input type="radio" name="payment" value="sbp"> СБП</label>
                    <label><input type="radio" name="payment" value="wallet"> Кошелек</label>

                    <button type="submit" class="btn btn--primary" style="width:100%; margin-top:10px;">Оплатить</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <div class="footer__col">
                <div class="footer__logo-group">
                    <img src="assets/images/logo_full.png" alt="Dr. DarSun">
                    <span class="footer__brand-text">Dr. DarSun</span>
                </div>
                <p class="footer__desc">Премиальные растительные масла. Сделано с душой.</p>
            </div>
            <div class="footer__col">
                <h4>Покупателям</h4>
                <a href="catalog.html">Каталог</a>
                <a href="delivery.html">Доставка</a>
                <a href="about.html">О нас</a>
            </div>
            <div class="footer__col">
                <h4>Контакты</h4>
                <a href="mailto:info@drdarsun.ru">info@drdarsun.ru</a>
                <div class="socials">
                    <a href="https://vk.ru/drdarsun" target="_blank" class="social-link" style="color: var(--text-main); font-size: 14px;">ВК</a>
                    <a href="https://t.me/drdarsun" target="_blank" class="social-link" style="color: var(--text-main); font-size: 14px;">Telegram</a>
                    <a href="https://www.instagram.com/drdarsun/" target="_blank" class="social-link" style="color: var(--text-main); font-size: 14px;">Instagram</a>
                </div>
            </div>
        </div>
        <div class="footer__bottom">
            <div class="container">© 2026 Dr. DarSun. Все права защищены.</div>
        </div>
    </footer>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/cart-page.js"></script>
    <script src="js/burger.js"></script>
    <script type="module" src="js/auth-header.js"></script>
    <script src="js/preloader.js"></script>
</body>
</html>
