<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. DarSun | Корзина</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body>
<header class="header">
    <div class="container header__inner">
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="index.html" class="logo"><div style="width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: bold; font-size: 20px;">D</div><span class="logo__text">Dr. DarSun</span></a>
            <a href="index.html" class="btn btn--outline" style="padding: 8px 16px; font-size: 12px;">На главную</a>
        </div>
        <nav class="nav"><a href="catalog.html">Продукция</a></nav>
        <div class="header__actions">
            <button id="theme-toggle" class="btn btn--outline" style="padding: 8px 16px;">🌓</button>
            <a href="profile.html" class="btn btn--outline">Профиль</a>
            <a href="cart.html" class="btn btn--primary">Корзина</a>
        </div>
    </div>
</header>

<main class="section" style="padding-top: 150px;">
    <div class="container" style="max-width: 800px;">
        <h1 class="section-title" style="text-align: left; margin-bottom: 40px;">Ваша корзина</h1>
        <div id="cart-items" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px;"></div>
        <div class="card" style="padding: 30px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px;">
                <span>Итого:</span>
                <span id="cart-total" style="font-weight: bold; color: var(--accent);">0 ₽</span>
            </div>
            <button class="btn btn--primary" style="width: 100%;" onclick="showToast('Оплата будет доступна после подключения эквайринга.', 'info')">Оформить заказ</button>
            <p style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 15px;">Оплата временно недоступна</p>
        </div>
    </div>
</main>
<footer class="footer"><div class="container footer__inner"><div class="footer__brand"><span class="logo__text">Dr. DarSun</span></div></div></footer>
<script type="module" src="/js/cart.js"></script></body>
</html>
