<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <style>
    .leaf { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.4s ease-in-out infinite; }
    .grain { transform-box: fill-box; transform-origin: center; animation: drift 3.7s ease-in-out infinite; }
    .grain:nth-of-type(2n) { animation-delay: -1.6s; }
    @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    @keyframes drift { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { .leaf,.grain { animation: none; } }
  </style>
