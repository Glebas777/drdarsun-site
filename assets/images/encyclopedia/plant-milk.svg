<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <style>
    .leaf { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4.6s ease-in-out infinite; }
    .nut { transform-box: fill-box; transform-origin: center; animation: float 3.5s ease-in-out infinite; }
    .nut:nth-of-type(2n) { animation-delay: -1.2s; }
    @keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .leaf,.nut { animation: none; } }
  </style>
