<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <style>
    .steam { transform-box: fill-box; transform-origin: center bottom; animation: steam 3.2s ease-in-out infinite; }
    .seed { transform-box: fill-box; transform-origin: center; animation: seed 3.8s ease-in-out infinite; }
    .seed:nth-of-type(2n) { animation-delay: -1.3s; }
    @keyframes steam { 0%,100% { opacity: .25; transform: translateY(3px) rotate(-3deg); } 50% { opacity: .8; transform: translateY(-5px) rotate(3deg); } }
    @keyframes seed { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-5px) rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .steam,.seed { animation: none; } }
  </style>
  <rect width="640" height="360" rx="28" fill="#f3ecd5"/>
  <circle cx="496" cy="82" r="118" fill="#fff9e8"/>
  <ellipse cx="320" cy="287" rx="203" ry="26" fill="#d8c99e" opacity=".45"/>
