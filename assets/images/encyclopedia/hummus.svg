  <path d="M167 177c36-24 96-36 153-36s117 12 153 36c-30 20-91 35-153 35s-123-15-153-35Z" fill="#e7c77f"/>
  <path d="M225 175c27-18 58-26 95-26s68 8 95 26c-28 15-61 24-95 24s-67-9-95-24Z" fill="#f1dda4"/>
  <g class="seed" fill="#6c8c42"><ellipse cx="268" cy="168" rx="7" ry="13" transform="rotate(-32 268 168)"/><ellipse cx="319" cy="154" rx="7" ry="13" transform="rotate(18 319 154)"/><ellipse cx="361" cy="179" rx="7" ry="13" transform="rotate(48 361 179)"/></g>
  <g class="steam" fill="none" stroke="#8c9a70" stroke-linecap="round" stroke-width="5"><path d="M257 111c-22-20 15-28-3-50"/><path d="M320 108c-18-22 16-31-1-56"/><path d="M383 111c-20-20 14-30-4-50"/></g>
