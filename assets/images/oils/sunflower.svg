  <g class="fruit-drift"><g transform="translate(456 184)"><g fill="#e1ad34"><ellipse cy="-52" rx="18" ry="43"/><ellipse cy="-52" rx="18" ry="43" transform="rotate(45)"/><ellipse cy="-52" rx="18" ry="43" transform="rotate(90)"/><ellipse cy="-52" rx="18" ry="43" transform="rotate(135)"/></g><circle r="33" fill="#75502f"/><g fill="#d2a14d"><circle cx="-10" cy="-7" r="3"/><circle cx="4" cy="-14" r="3"/><circle cx="13" cy="0" r="3"/><circle cx="-5" cy="8" r="3"/><circle cx="8" cy="15" r="3"/></g></g></g>
  <path class="fruit-drift" d="M480 249c45-20 85 10 76 48-8 32-52 48-83 27-25-16-24-54 7-75Z" fill="#d9b945"/><path class="fruit-drift" d="M493 265c21 14 29 33 26 54" fill="none" stroke="#896a35" stroke-width="4"/>
</svg>
