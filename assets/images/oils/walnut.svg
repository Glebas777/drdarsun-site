  <path class="fruit-drift" d="M425 246c-23-26-16-64 12-82 14-9 29-8 39 0 13-9 29-8 42 4 24 22 20 58-6 80l-42 36z" fill="#a5794e"/>
  <path class="fruit-drift" d="M476 166c-8 34-5 73 4 116M448 183c17 25 26 57 30 95M504 174c-18 23-25 51-25 79" fill="none" stroke="#d0a276" stroke-width="5" stroke-linecap="round"/>
