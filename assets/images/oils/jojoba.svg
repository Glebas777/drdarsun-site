<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <style>
    .plant-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: plant-sway 4.8s ease-in-out infinite; }
    .fruit-drift { transform-box: fill-box; transform-origin: 50% 70%; animation: fruit-drift 3.6s ease-in-out infinite; }
    @keyframes plant-sway { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.8deg); } }
    @keyframes fruit-drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .plant-sway,.fruit-drift { animation: none; } }
  </style>
  <rect width="640" height="360" rx="28" fill="#e8eee1"/><circle cx="500" cy="86" r="116" fill="#f7f5e7"/>
  <path d="M115 315c103-97 188-172 323-237M180 321c85-59 175-92 306-104" fill="none" stroke="#687b4d" stroke-width="8" stroke-linecap="round"/>
  <g class="plant-sway" fill="#738653"><ellipse cx="165" cy="254" rx="19" ry="58" transform="rotate(-38 165 254)"/><ellipse cx="226" cy="190" rx="19" ry="60" transform="rotate(-36 226 190)"/><ellipse cx="294" cy="132" rx="18" ry="57" transform="rotate(-31 294 132)"/><ellipse cx="352" cy="238" rx="18" ry="58" transform="rotate(-42 352 238)"/><ellipse cx="425" cy="184" rx="18" ry="59" transform="rotate(-38 425 184)"/></g>
  <g class="fruit-drift" fill="#a78b4b"><ellipse cx="463" cy="237" rx="17" ry="25" transform="rotate(-25 463 237)"/><ellipse cx="507" cy="266" rx="17" ry="25" transform="rotate(-25 507 266)"/><ellipse cx="468" cy="302" rx="17" ry="25" transform="rotate(-25 468 302)"/></g>
  <path class="plant-sway" d="M465 214c25-18 49-20 71-5M488 241c20-12 40-13 60-3M451 284c21-15 42-16 62-5" fill="none" stroke="#6b7f4e" stroke-width="5"/>
</svg>
