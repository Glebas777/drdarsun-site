  <circle class="fruit-drift" cx="473" cy="227" r="68" fill="#8d6948"/><path class="fruit-drift" d="M423 218c17-44 75-62 111-28 33 31 23 84-17 103-45 22-103-17-94-75Z" fill="#f7f0dc"/><path class="fruit-drift" d="M431 221c17-35 60-45 90-22" fill="none" stroke="#fff9e8" stroke-width="8"/>
  <g class="fruit-drift" fill="#8d6948"><circle cx="454" cy="212" r="5"/><circle cx="484" cy="205" r="5"/><circle cx="469" cy="242" r="5"/></g>
  <path d="M459 278c-17 13-27 30-29 48M478 282c0 20 7 36 21 48M495 274c16 9 28 22 34 39" fill="none" stroke="#748855" stroke-width="6" stroke-linecap="round"/>
</svg>
