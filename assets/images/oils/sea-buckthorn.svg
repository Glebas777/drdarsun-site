<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <style>
    .plant-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: plant-sway 4.8s ease-in-out infinite; }
    .fruit-drift { transform-box: fill-box; transform-origin: 50% 70%; animation: fruit-drift 3.6s ease-in-out infinite; }
    @keyframes plant-sway { 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.8deg); } }
    @keyframes fruit-drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .plant-sway,.fruit-drift { animation: none; } }
  </style>
  <rect width="640" height="360" rx="28" fill="#f4e8da"/><circle cx="500" cy="82" r="119" fill="#fff4e2"/>
  <path d="M101 319c92-103 181-176 309-237M198 316c87-70 175-110 272-132" fill="none" stroke="#65794f" stroke-width="8" stroke-linecap="round"/>
  <g class="plant-sway" fill="#829260"><ellipse cx="167" cy="248" rx="60" ry="17" transform="rotate(-41 167 248)"/><ellipse cx="240" cy="178" rx="58" ry="17" transform="rotate(-36 240 178)"/><ellipse cx="318" cy="124" rx="57" ry="17" transform="rotate(-29 318 124)"/></g>
  <path d="M451 147c19-20 45-20 60-2M455 176c23-21 53-21 70-2M445 207c27-22 58-21 77 0M450 238c23-17 51-16 69 2" fill="none" stroke="#72834f" stroke-width="5"/>
  <g class="fruit-drift" fill="#e89735"><circle cx="457" cy="158" r="14"/><circle cx="486" cy="164" r="14"/><circle cx="522" cy="157" r="14"/><circle cx="465" cy="190" r="14"/><circle cx="498" cy="194" r="14"/><circle cx="531" cy="188" r="14"/><circle cx="450" cy="220" r="14"/><circle cx="482" cy="224" r="14"/><circle cx="515" cy="220" r="14"/><circle cx="463" cy="251" r="14"/><circle cx="496" cy="255" r="14"/></g>
  <g fill="#ffca70"><circle cx="453" cy="154" r="4"/><circle cx="482" cy="160" r="4"/><circle cx="518" cy="153" r="4"/><circle cx="461" cy="186" r="4"/></g>
</svg>
