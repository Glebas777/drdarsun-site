<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. DarSun | Каталог</title>
    <link rel="stylesheet" href="css/base.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <style>/* Контейнер каталога */
.catalog-layout {
    display: flex;
    gap: 30px;
    padding: 40px 0;
}

/* Фильтры (ПК) */
.filters-sidebar {
    width: 250px;
    flex-shrink: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    height: fit-content;
    position: sticky;
    top: 100px;
}

.filters-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.filters-header h3 {
    margin: 0;
    font-size: 18px;
}

.filters-close {
    display: none; /* Скрываем на ПК */
    background: transparent;
    border: none;
    color: var(--text-main);
    font-size: 24px;
    cursor: pointer;
}

.filter-group {
    margin-bottom: 20px;
}

.filter-group label {
    display: block;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-weight: 600;
}

.filter-options label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    color: var(--text-main);
    font-weight: 400;
}

.filter-options input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent-gold);
}

.filter-group input[type="range"] {
    width: 100%;
    accent-color: var(--accent-gold);
    margin-bottom: 5px;
}

.filter-group select {
    width: 100%;
    padding: 10px;
    background: var(--bg-color);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-main);
    font-family: inherit;
    outline: none;
}

/* Сетка товаров */
.catalog-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px;
}

/* Кнопка фильтров на мобилке */
.filters-mobile-btn {
    display: none;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent-gold);
    color: #000;
    border: none;
    border-radius: 30px;
    padding: 12px 24px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 100;
    cursor: pointer;
}

/* Мобильная адаптация */
@media (max-width: 768px) {
    .catalog-layout {
        flex-direction: column;
        padding: 20px;
    }

    .filters-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 9999;
        border-radius: 0;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        overflow-y: auto;
    }

    .filters-sidebar.active {
        transform: translateX(0);
    }

    .filters-close {
        display: block;
    }

    .filters-mobile-btn {
        display: flex;
        align-items: center;
        gap: 8px;
    }
}</style>

    <header class="header">
        <div class="container header__inner">
            <a href="index.html" class="logo"><img src="assets/images/banner.png" alt="Dr. DarSun"></a>
            <nav class="nav">
                <a href="catalog.html" class="active">Каталог</a>
                <a href="about.html">О нас</a>
                <a href="delivery.html">Доставка</a>
            </nav>
            <div class="header__actions" id="auth-buttons"></div>
            <button class="burger" id="burger-btn"><span></span><span></span><span></span></button>
        </div>
        <div class="mobile-menu" id="mobile-menu">
            <a href="catalog.html">Каталог</a>
            <a href="about.html">О нас</a>
            <a href="delivery.html">Доставка</a>
        </div>
    </header>

    <main class="container">
<!-- Контейнер каталога -->
<div class="catalog-layout">
    <!-- Фильтры (ПК) -->
    <aside class="filters-sidebar" id="filters-sidebar">
        <div class="filters-header">
            <h3>Фильтры</h3>
            <button class="filters-close" id="filters-close">×</button>
        </div>
        
        <div class="filter-group">
            <label>Категория</label>
            <div class="filter-options">
                <label><input type="checkbox" class="filter-category" value="all" checked> Все</label>
                <label><input type="checkbox" class="filter-category" value="oil"> Масла</label>
                <label><input type="checkbox" class="filter-category" value="gift"> Наборы</label>
            </div>
        </div>

        <div class="filter-group">
            <label>Цена</label>
            <input type="range" id="price-range" min="0" max="5000" step="100" value="5000">
            <div style="display: flex; justify-content: space-between;">
                <span>0 ₽</span>
                <span id="price-value">5000 ₽</span>
            </div>
        </div>

        <div class="filter-group">
            <label>Сортировка</label>
            <select id="sort-select">
                <option value="default">По умолчанию</option>
                <option value="price-asc">Сначала дешевле</option>
                <option value="price-desc">Сначала дороже</option>
            </select>
        </div>
    </aside>

    <!-- Сетка товаров -->
    <div class="catalog-grid" id="product-grid">
        <!-- Товары рендерятся через JS -->
    </div>
</div>

<!-- Кнопка открытия фильтров (на мобилке) -->
<button class="filters-mobile-btn" id="filters-mobile-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
    Фильтры
</button>
    </main>

            </div>
            <div class="footer__col">
                <h4>Покупателям</h4>
                <a href="catalog.html">Каталог</a>
                <a href="delivery.html">Доставка</a>
                <a href="about.html">О нас</a>
            </div>
            <div class="footer__col">
                <h4>Контакты</h4>
                <a href="mailto:info@drdarsun.ru">info@drdarsun.ru</a>
                <div class="socials">
                    <a href="https://vk.ru/drdarsun" target="_blank" class="social-link" style="color: var(--text-main); font-size: 14px;">ВК</a>

                    <a href="https://www.instagram.com/drdarsun/" target="_blank" class="social-link" style="color: var(--text-main); font-size: 14px;">Instagram</a>
                </div>
            </div>
        </div>
        <div class="footer__bottom">
            <div class="container">© 2026 Dr. DarSun. Все права защищены.</div>
        </div>
    </footer>

</body>
</html>
