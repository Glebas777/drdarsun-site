<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. DarSun | Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="card auth-box">
        <div class="auth-tabs">
            <button id="tab-login" class="auth-tab active">Вход</button>
            <button id="tab-register" class="auth-tab">Регистрация</button>
        </div>

        <!-- Вход -->
        <form id="login-form" class="auth-form">
            <input type="email" id="login-email" class="review-input" placeholder="Email" required>
            <input type="password" id="login-password" class="review-input" placeholder="Пароль" required>
            <button type="submit" class="btn btn--primary" style="width: 100%;">Войти</button>
        </form>

        <!-- Регистрация -->
        <form id="register-form" class="auth-form" style="display: none;">
            <input type="text" id="reg-name" class="review-input" placeholder="Имя" required>
            <input type="email" id="reg-email" class="review-input" placeholder="Email" required>
            <input type="password" id="reg-password" class="review-input" placeholder="Пароль" required>
            <button type="submit" class="btn btn--primary" style="width: 100%;">Зарегистрироваться</button>
        </form>

        <div style="text-align: center; margin: 20px 0; color: var(--text-muted);">или</div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button id="btn-google" class="btn btn--outline" style="width: 100%;">Войти через Google</button>
            <button id="btn-yandex" class="btn btn--outline" style="width: 100%;">Войти через Яндекс</button>
            <button id="btn-telegram" class="btn btn--outline" style="width: 100%;">Войти через Telegram</button>
        </div>
    </div>
</div>
<script type="module" src="js/auth.js"></script>
</body>
</html>
