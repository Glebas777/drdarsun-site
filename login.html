<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dr. DarSun | Вход</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <!-- ФОН С ВИДЕО -->
    <div class="video-background">
        <video class="bg-video active" src="assets/videos/кадр1.mp4" muted playsinline autoplay></video>
        <video class="bg-video" src="assets/videos/кадр2.mp4" muted playsinline></video>
        <video class="bg-video" src="assets/videos/кадр3.mp4" muted playsinline></video>
        <video class="bg-video" src="assets/videos/кадр4.mp4" muted playsinline></video>
        <video class="bg-video" src="assets/videos/кадр5.mp4" muted playsinline></video>
        <video class="bg-video" src="assets/videos/кадр6.mp4" muted playsinline></video>
    </div>
    <div class="video-overlay"></div>

    <a href="index.html" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        На главную
    </a>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <img src="assets/images/logo.png" alt="Dr. DarSun" class="auth-logo-img">
                <h2>С возвращением</h2>
                <p>Войдите, чтобы управлять заказами</p>
            </div>

            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="your@email.com" required>
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>

                <div class="login-actions">
                    <button type="submit" class="btn btn--primary btn--full">Войти</button>
                    
                    <div class="menu-container">
                        <button type="button" class="menu-btn" id="menu-toggle">•••</button>
                        <div class="menu-dropdown" id="menu-dropdown">
                            <a href="#" id="qr-login">Вход по QR-коду</a>
                            <a href="#" id="backup-login">Резервный код</a>
                            <a href="#" id="forgot-password">Забыли пароль?</a>
                        </div>
                    </div>
                </div>
            </form>

            <div class="auth-divider">
                <span>или войти через</span>
            </div>

            <div class="auth-socials">
                <button class="social-btn yandex" id="btn-yandex">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3H10c-2.8 0-4.5 1.5-4.5 4 0 1.6.7 2.6 2.1 3.6L4.3 16h2.5l3.2-5.2h1V16h2.2V3H12.5zM11 9.6h-1.3c-1.4 0-2.1-.7-2.1-2.2 0-1.4.7-2.2 2.1-2.2H11v4.4z"/></svg>
                    Яндекс
                </button>
                <button class="social-btn google" id="btn-google">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
                    Google
                </button>
                <button class="social-btn telegram" id="btn-telegram">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                    Telegram
                </button>
            </div>
            
            <div class="auth-footer">
                <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
