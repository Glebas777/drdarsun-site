<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. DarSun | Вход</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="login-header">
    <button class="back-btn" onclick="history.length > 1 ? history.back() : window.location.href='index.html'">←</button>
    <a href="index.html" class="logo">Dr. DarSun</a>
    <button class="dots-btn" id="dotsBtn">⋯</button>
  </header>

  <div class="dropdown-menu" id="dropdownMenu">
    <button class="dropdown-item" id="menuBackup">Резервный код</button>
    <button class="dropdown-item" id="menuQr">QR-код (Telegram)</button>
  </div>

  <main class="login-container">
    <div class="auth-tabs">
      <div class="auth-tab" id="tab-login" style="border-bottom: 2px solid var(--accent);">Вход</div>
      <div class="auth-tab" id="tab-register">Регистрация</div>
    </div>

    <form class="auth-form" id="login-form">
      <div class="input-group"><label>Email</label><input type="email" id="login-email" class="input" required></div>
      <div class="input-group"><label>Пароль</label><input type="password" id="login-password" class="input" required></div>
      <button type="submit" class="btn btn--primary" style="width: 100%;">Войти</button>
    </form>

    <form class="auth-form" id="register-form" style="display: none;">
      <div class="input-group"><label>Имя</label><input type="text" id="reg-name" class="input" required></div>
      <div class="input-group"><label>Email</label><input type="email" id="reg-email" class="input" required></div>
      <div class="input-group"><label>Пароль</label><input type="password" id="reg-password" class="input" required></div>
      <button type="submit" class="btn btn--primary" style="width: 100%;">Создать аккаунт</button>
    </form>

    <div class="divider">или</div>

    <button class="social-btn" id="btn-google">Войти через Google</button>
    <button class="social-btn" id="btn-yandex">Войти через Яндекс</button>
    <button class="social-btn" id="btn-telegram">Войти через Telegram</button>
  </main>

  <div class="modal-overlay" id="backupModal">
    <div class="modal-content">
      <button class="modal-close" onclick="document.getElementById('backupModal').classList.remove('active')">✕</button>
      <h2 style="margin-top: 0; font-size: 20px;">Резервный код</h2>
      <div class="input-group" style="margin-top: 20px;"><label>Email</label><input type="email" id="backupEmail" class="input"></div>
      <div class="input-group"><label>Код</label><input type="text" id="backupCode" class="input"></div>
      <button class="btn btn--primary" style="width: 100%; margin-top: 10px;" id="submitBackupBtn">Войти</button>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
