<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. DarSun | Профиль</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<header class="header">
    <div class="container header__inner">
        <div class="header__left">
            <a href="index.html" class="logo"><div class="logo__icon">D</div><span class="logo__text">Dr. DarSun</span></a>
            <a href="index.html" class="btn btn--outline header__home-btn">На главную</a>
        </div>
        <nav class="nav"><a href="about.html">О компании</a><a href="catalog.html">Продукция</a></nav>
        <div class="header__actions" id="auth-buttons"><a href="login.html" class="btn btn--outline">Войти</a></div>
    </div>
</header>

<main class="section" style="padding-top: 150px;">
    <div class="container" style="max-width: 900px;">
        <h1 class="section-title" style="text-align: left; margin-bottom: 40px;">Мой профиль</h1>
        
        <div class="profile-grid">
            <div class="card">
                <h3>Личные данные</h3>
                <p><strong>Имя:</strong> <span id="user-name">-</span></p>
                <p><strong>Email:</strong> <span id="user-email">-</span></p>
                <button id="logout-btn" class="btn btn--outline" style="width: 100%; margin-top: 20px;">Выйти</button>
            </div>

            <div class="card">
                <h3>Безопасность</h3>
                <div id="tg-link-block" style="display: none;">
                    <p>Привяжите Telegram для безопасности.</p>
                    <button id="link-tg-btn" class="btn btn--primary">Привязать</button>
                </div>
                <div id="all-linked-block" style="display: none; color: #4CAF50; font-weight: bold;">
                    ✅ Все привязано
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="footer"><div class="container footer__inner"><span class="logo__text">Dr. DarSun</span></div></footer>
<script type="module" src="js/profile.js"></script>
</body>
</html>
