<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
    <style>
        body { background: #0A0A0A; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #151515; border: 1px solid #333; padding: 40px; border-radius: 24px; text-align: center; max-width: 400px; width: 90%; }
        input { width: 100%; padding: 15px; background: #0A0A0A; border: 1px solid #333; border-radius: 12px; color: #fff; text-align: center; font-size: 24px; letter-spacing: 8px; outline: none; margin: 20px 0; }
        button { width: 100%; padding: 15px; border-radius: 12px; background: #D4AF37; color: #000; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="title">Проверяем токен...</h2>
        <p id="status">Пожалуйста, подождите.</p>
        
        <!-- Блок для ввода 2FA -->
        <div id="mfa-block" style="display: none;">
            <p style="color: #aaa; font-size: 14px;">Введите код из приложения (2FA)</p>
            <input type="text" id="mfa-code" placeholder="000000" maxlength="6">
            <button id="mfa-submit">Подтвердить</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rrpcqrvkhmlrdqvffnax.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_1Fh3LgYtH3wEkQjvBfiZsA_WZZsfsLF'; // Вставь свой ключ!

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
            }
        });

        async function confirm() {
            const params = new URLSearchParams(window.location.search);
            const token_hash = params.get('token_hash');
            const type = params.get('type');

            if (!token_hash) {
                document.getElementById('status').textContent = 'Ошибка: токен не найден.';
                return;
            }

            const { error } = await supabaseClient.auth.verifyOtp({
                token_hash: token_hash,
                type: 'magiclink'
            });

            if (error) {
                document.getElementById('status').textContent = 'Ошибка: ' + error.message;
                return;
            }

            // ПРОВЕРКА 2FA
            const { data: mfaData, error: mfaError } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
            
            if (!mfaError && mfaData.nextLevel === 'aal2' && mfaData.currentLevel !== 'aal2') {
                // 2FA включена, показываем поле ввода
                document.getElementById('title').textContent = 'Введите код 2FA';
                document.getElementById('status').textContent = 'Аккаунт защищен дополнительным кодом.';
                document.getElementById('mfa-block').style.display = 'block';

                document.getElementById('mfa-submit').addEventListener('click', async () => {
                    const code = document.getElementById('mfa-code').value;
                    if (code.length !== 6) return alert('Введите 6 цифр');

                    const { data: factors } = await supabaseClient.auth.mfa.listFactors();
                    const totpFactor = factors.totp[0];
                    if (!totpFactor) return alert('Фактор не найден');

                    const { error: verifyError } = await supabaseClient.auth.mfa.challengeAndVerify({
                        factorId: totpFactor.id,
                        code: code
                    });

                    if (verifyError) {
                        alert('Неверный код: ' + verifyError.message);
                    } else {
                        window.location.href = 'https://drdarsun.ru/profile.html';
                    }
                });
            } else {
                // 2FA нет — пускаем сразу
                document.getElementById('status').textContent = 'Успех! Перенаправление...';
                window.location.href = 'https://drdarsun.ru/profile.html';
            }
        }

        confirm();
    </script>
</body>
</html>
