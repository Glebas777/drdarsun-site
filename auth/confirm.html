<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>Подтверждение · Dr. DarSun</title>
    <link rel="stylesheet" href="../css/base.css?v=chat-ui-fix-1">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/auth-mobile.css">
</head>
<body class="auth-page standalone-auth-page">
    <main class="standalone-auth-card standalone-confirm-card">
        <h2 id="title">Проверяем токен...</h2>
        <p id="status">Пожалуйста, подождите.</p>
        <a href="../login.html" style="color: #e0bd72;">Вернуться ко входу</a>
        <p id="resend-signup-link" hidden><a href="../register.html?resend=1" style="color: #e0bd72;">Запросить новое письмо подтверждения</a></p>
    </main>

    <script type="module">
        import { supabase } from '../js/supabase-client.js';

        function showSignupResendLink() {
            document.getElementById('resend-signup-link').hidden = false;
        }

        async function confirm() {
            const params = new URLSearchParams(window.location.search);
            const tokenHash = params.get('token_hash');
            const code = params.get('code');
            const type = params.get('type');
            const provider = params.get('provider');
            const state = params.get('state');
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');
            const refreshToken = fragment.get('refresh_token');
            const fragmentType = fragment.get('type');
            window.history.replaceState({}, document.title, window.location.pathname);

            let storedState;
            try {
                if (provider === 'google' || provider === 'yandex') {
                    storedState = JSON.parse(sessionStorage.getItem(`oauth_state_${provider}`) || 'null');
                    sessionStorage.removeItem(`oauth_state_${provider}`);
                }
            } catch (storageError) {
                console.warn('OAuth state could not be checked:', storageError);
            }

            const isOAuthCallback = provider === 'google' || provider === 'yandex';
            const stateMatches = typeof state === 'string' &&
                /^[a-f0-9]{64}$/i.test(state) &&
                storedState?.value === state &&
                Number.isFinite(storedState?.expiresAt) &&
                storedState.expiresAt > Date.now();
            if (isOAuthCallback && !stateMatches) {
                document.getElementById('status').textContent = 'Попытка входа устарела или не подтверждена. Начните вход заново.';
                return;
            }

            let data;
            let error;
            try {
                if (code) {
                    ({ data, error } = await supabase.auth.exchangeCodeForSession(code));
                } else if (
                    accessToken &&
                    refreshToken &&
                    ['signup', 'invite', 'magiclink', 'email_change'].includes(fragmentType)
                ) {
                    ({ data, error } = await supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    }));
                } else if (
                    tokenHash &&
                    ['signup', 'invite', 'magiclink', 'email_change'].includes(type)
                ) {
                    ({ data, error } = await supabase.auth.verifyOtp({
                        token_hash: tokenHash,
                        type
                    }));
                } else {
                    document.getElementById('status').textContent =
                        'Ссылка подтверждения неполная или истекла. Запросите новое письмо.';
                    if (type !== 'email_change') showSignupResendLink();
                    return;
                }
            } catch (requestError) {
                console.error('Auth confirmation request failed:', requestError?.name || 'UnknownError');
                document.getElementById('status').textContent = 'Не удалось связаться с сервисом входа. Начните вход заново.';
                return;
            }

            const confirmationType = fragmentType || type;
            if (error || (!data?.session && confirmationType !== 'email_change')) {
                console.warn('Auth confirmation was rejected:', error?.code || error?.status || 'Session was not created.');
                document.getElementById('status').textContent = confirmationType === 'email_change'
                    ? 'Ссылка недействительна, уже использована или истекла. Запросите новое письмо из настроек профиля.'
                    : 'Ссылка недействительна, уже использована или истекла. Запросите новое письмо подтверждения.';
                if (confirmationType !== 'email_change') showSignupResendLink();
                return;
            }

            if (data?.session?.user?.id) {
                let assurance;
                let assuranceError;
                try {
                    ({ data: assurance, error: assuranceError } =
                        await supabase.auth.mfa.getAuthenticatorAssuranceLevel());
                } catch (mfaRequestError) {
                    console.error('Auth confirmation MFA check failed:', mfaRequestError?.name || 'UnknownError');
                    document.getElementById('status').textContent =
                        'Не удалось проверить дополнительную защиту аккаунта. Вернитесь ко входу и попробуйте снова.';
                    return;
                }
                if (assuranceError || !assurance?.nextLevel) {
                    console.error('Auth confirmation MFA check failed:', assuranceError?.code || assuranceError?.status || 'UnknownError');
                    document.getElementById('status').textContent =
                        'Не удалось проверить дополнительную защиту аккаунта. Вернитесь ко входу и попробуйте снова.';
                    return;
                }
                if (assurance.nextLevel === 'aal2' && assurance.currentLevel !== 'aal2') {
                    window.location.href = '../login.html?mfa=required';
                    return;
                }
                try {
                    localStorage.setItem('pending_device_registration', data.session.user.id);
                } catch (storageError) {
                    console.warn('Pending device registration could not be saved:', storageError);
                }
            }

            const title = document.getElementById('title');
            const status = document.getElementById('status');
            if (confirmationType === 'email_change') {
                title.textContent = 'Почта подтверждена';
                if (!data?.session) {
                    status.textContent = 'Изменение почты подтверждено. Войдите в аккаунт с новым адресом.';
                    return;
                }
                status.textContent = 'Изменение почты подтверждено. Возвращаем вас в профиль...';
            } else {
                status.textContent = 'Успех! Перенаправление...';
            }
            window.location.href = '../profile.html';
        }

        confirm();
    </script>
    <script src="../js/site-status.js?v=service-timeouts-2"></script>
    <script type="module" src="../js/temporary-payment-notice.js?v=service-timeouts-2"></script>
</body>
</html>
