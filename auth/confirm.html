<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
</head>
<body style="background: #0A0A0A; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center; max-width: 400px; width: 90%;">
        <div id="loading">
            <h2>Проверяем токен...</h2>
            <p id="status">Пожалуйста, подождите.</p>
        </div>
        <div id="mfa-block" style="display: none;">
            <h2>Двухфакторная аутентификация</h2>
            <p>Введите 6-значный код из приложения.</p>
            <input type="text" id="mfa-code" placeholder="000000" maxlength="6" style="width: 100%; padding: 15px; text-align: center; font-size: 24px; letter-spacing: 5px; margin: 15px 0; border-radius: 8px; border: 1px solid #333; background: #151515; color: #fff;">
            <button id="mfa-submit" style="width: 100%; padding: 15px; background: #D4AF37; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Подтвердить</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://drdarsun-site-main.layero.app';
        const SUPABASE_ANON_KEY = 'ТВОЙ_ANON_KEY_ИЗ_ENV';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function confirm() {
            const params = new URLSearchParams(window.location.search);
            const token_hash = params.get('token_hash');
            if (!token_hash) {
                document.getElementById('status').textContent = 'Ошибка: токен не найден.';
                return;
            }

            const { error } = await supabaseClient.auth.verifyOtp({
                token_hash: token_hash,
                type: 'magiclink'
            });

            if (error) {
                document.getElementById('status').textContent = 'Ошибка: ' + error.message;
                return;
            }

            // ПРОВЕРКА 2FA
            const { data: mfaData, error: mfaError } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
            
            if (!mfaError && mfaData.nextLevel === 'aal2' && mfaData.currentLevel !== 'aal2') {
                // Показываем блок ввода 2FA
                document.getElementById('loading').style.display = 'none';
                document.getElementById('mfa-block').style.display = 'block';
            } else {
                // 2FA не нужна
                window.location.href = 'https://drdarsun.ru/profile.html';
            }
        }

        // Обработка ввода 2FA
        document.getElementById('mfa-submit')?.addEventListener('click', async () => {
            const code = document.getElementById('mfa-code').value;
            if (code.length !== 6) return alert('Введите 6 цифр');

            const { data: factors } = await supabaseClient.auth.mfa.listFactors();
            const totpFactor = factors.totp[0];
            if (!totpFactor) return alert('Фактор не найден');

            const { error } = await supabaseClient.auth.mfa.challengeAndVerify({
                factorId: totpFactor.id,
                code: code
            });

            if (error) {
                alert('Неверный код');
            } else {
                window.location.href = 'https://drdarsun.ru/profile.html';
            }
        });

        confirm();
    </script>
</body>
</html>
