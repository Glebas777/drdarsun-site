<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>Подтверждение · Dr. DarSun</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/auth-mobile.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
</head>
<body class="auth-page standalone-auth-page">
    <main class="standalone-auth-card standalone-confirm-card">
        <h2 id="title">Проверяем токен...</h2>
        <p id="status">Пожалуйста, подождите.</p>
        <a href="https://drdarsun.ru/login.html" style="color: #e0bd72;">Вернуться ко входу</a>
    </main>

    <script>
        const SUPABASE_URL = 'https://drdarsun-site-main.layero.app';
        const SUPABASE_ANON_KEY = 'sb_publishable_1Fh3LgYtH3wEkQjvBfiZsA_WZZsfsLF'; // Вставь свой ключ!

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        });

        async function confirm() {
            const params = new URLSearchParams(window.location.search);
            const token_hash = params.get('token_hash');
            const type = params.get('type');
            const provider = params.get('provider');
            const state = params.get('state');
            window.history.replaceState({}, document.title, window.location.pathname);

            let storedState;
            try {
                if (provider === 'google' || provider === 'yandex') {
                    storedState = JSON.parse(sessionStorage.getItem(`oauth_state_${provider}`) || 'null');
                    sessionStorage.removeItem(`oauth_state_${provider}`);
                }
            } catch (storageError) {
                console.warn('OAuth state could not be checked:', storageError);
            }

            const isOAuthCallback = provider === 'google' || provider === 'yandex';
            const stateMatches = typeof state === 'string' &&
                /^[a-f0-9]{64}$/i.test(state) &&
                storedState?.value === state &&
                Number.isFinite(storedState?.expiresAt) &&
                storedState.expiresAt > Date.now();
            if (isOAuthCallback && !stateMatches) {
                document.getElementById('status').textContent = 'Попытка входа устарела или не подтверждена. Начните вход заново.';
                return;
            }

            if (!token_hash || !['magiclink', 'email_change'].includes(type)) {
                document.getElementById('status').textContent = 'Ссылка подтверждения неполная или истекла. Запросите новое письмо.';
                return;
            }

            const { data, error } = await supabaseClient.auth.verifyOtp({
                token_hash: token_hash,
                type
            });

            if (error || (!data?.session && type !== 'email_change')) {
                document.getElementById('status').textContent = error?.message || 'Не удалось подтвердить ссылку. Запросите новую.';
                return;
            }

            if (data?.session?.user?.id) {
                try {
                    localStorage.setItem('pending_device_registration', data.session.user.id);
                } catch (storageError) {
                    console.warn('Pending device registration could not be saved:', storageError);
                }
            }

            const title = document.getElementById('title');
            const status = document.getElementById('status');
            if (type === 'email_change') {
                title.textContent = 'Почта подтверждена';
                if (!data?.session) {
                    status.textContent = 'Изменение почты подтверждено. Войдите в аккаунт с новым адресом.';
                    return;
                }
                status.textContent = 'Изменение почты подтверждено. Возвращаем вас в профиль...';
            } else {
                status.textContent = 'Успех! Перенаправление...';
            }
            window.location.href = 'https://drdarsun.ru/profile.html';
        }

        confirm();
    </script>
    <script src="../js/site-status.js"></script>
    <script type="module" src="../js/temporary-payment-notice.js"></script>
</body>
</html>
