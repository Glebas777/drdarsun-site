<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отзывы - Dr. DarSun</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <!-- Библиотека для книги (грузим синхронно) -->
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="index.html" class="logo"><div style="width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: bold; font-size: 20px;">D</div><span class="logo__text">Dr. DarSun</span></a>
            <a href="index.html" class="btn btn--outline" style="padding: 8px 16px; font-size: 12px;">На главную</a>
        </div>
        <nav class="nav"><a href="about.html">О компании</a><a href="catalog.html">Продукция</a></nav>
        <div class="header__actions">
            <button id="theme-toggle" class="btn btn--outline" style="padding: 8px 16px;">🌓</button>
            <a href="profile.html" class="btn btn--outline">Профиль</a>
            <a href="cart.html" class="btn btn--primary">Корзина</a>
        </div>
    </div>
  </header>
  
  <main class="book-container">
    <h1>Книга отзывов</h1>
    <div id="book" class="book"></div>
    
    <div class="book-controls">
      <button id="prevBtn" disabled>← Назад</button>
      <span class="page-num" id="pageNum">Обложка</span>
      <button id="nextBtn">Вперед →</button>
    </div>
  </main>

  <!-- Подключаем main.js для showToast и about.js -->
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/about.js"></script>
</body>
</html>
