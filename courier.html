<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Панель курьера | Dr. DarSun</title>
    <link rel="stylesheet" href="css/base.css?v=chat-ui-fix-1">
    <link rel="stylesheet" href="css/courier.css?v=courier-panel-1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="courier-header">
        <a class="courier-back" href="index.html">← Dr. DarSun</a>
        <div class="courier-header__actions">
            <span id="courier-name">Курьер</span>
            <button class="btn courier-logout" type="button" id="courier-logout">Выйти</button>
        </div>
    </header>
    <main class="courier-page">
        <section class="courier-page__intro">
            <p class="eyebrow">РАБОЧАЯ ПАНЕЛЬ</p>
            <h1>Заказы на доставку</h1>
            <p class="courier-muted">Контактные данные доступны только для назначенных и доступных к доставке заказов.</p>
            <button class="btn courier-refresh" type="button" id="courier-refresh">Обновить список</button>
        </section>
        <p class="courier-status" id="courier-status" role="status" aria-live="polite">Проверяем доступ…</p>
        <section class="courier-orders" id="courier-orders" aria-live="polite"></section>
    </main>
    <script type="module" src="js/courier.js?v=courier-panel-1"></script>
    <script src="js/site-status.js?v=service-timeouts-2"></script>
</body>
</html>
